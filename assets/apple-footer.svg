<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d"/>
      <stop offset="50%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <style>
      .sf-font {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="996" height="76" rx="16" ry="16" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="1.2"/>

  <!-- Left/Center Text -->
  <text x="40" y="45" class="sf-font" font-size="13" font-weight="400" fill="#9CA3AF">
    <tspan fill="#F3F4F6" font-weight="600">Artyom</tspan> • Engineered with curiosity, passion &amp; open-source
  </text>

  <!-- Right Side Status / Copyright -->
  <text x="960" y="45" text-anchor="end" class="sf-font" font-size="12" font-weight="500" fill="#6B7280">
    nenubics • © 2026
  </text>
</svg>
